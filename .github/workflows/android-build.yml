name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate and Save Permanent Keystore (If Missing)
        run: |
          if [ ! -f "kainuwa_keystore.jks" ]; then
            echo "Keystore missing. Generating and committing to repository..."
            keytool -genkey -v -keystore kainuwa_keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias kainuwa_key -storepass kainuwa123 -keypass kainuwa123 \
              -dname "CN=Kainuwa, OU=Dev, O=Kainuwa Digital, L=Abuja, S=FCT, C=NG"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add kainuwa_keystore.jks
            git commit -m "chore: auto-generate permanent Android release keystore"
            git push
          else
            echo "Permanent keystore found. Reusing it for signature consistency."
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerate Android Architecture
        run: |
          rm -rf android/
          flutter create --org com.kainuwa --project-name bot .
          rm -f android/app/build.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/settings.gradle.kts

      - name: Apply Permanent Keystore & Firebase Config
        run: |
          cp kainuwa_keystore.jks android/app/keystore.jks
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          else
            echo "WARNING: google-services.json not found in repository root!"
          fi

      - name: Configure Top-Level Gradle
        run: |
          cat << 'top_gradle_EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          def newBuildDir = rootProject.layout.buildDirectory.dir("../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)
          subprojects {
              def newSubprojectBuildDir = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }
          tasks.register("clean", Delete) {
              delete rootProject.layout.buildDirectory
          }
          top_gradle_EOF

      - name: Configure Settings Gradle
        run: |
          cat << 'settings_gradle_EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.7.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.24" apply false
          }

          include ":app"
          settings_gradle_EOF

      - name: Configure App-Level Gradle & Application ID
        run: |
          cat << 'gradle_EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }

          android {
              namespace "com.kainuwa.bot"
              compileSdk 36

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.kainuwa.bot"
                  minSdk 21
                  targetSdk 36
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file("keystore.jks")
                      storePassword "kainuwa123"
                      keyAlias "kainuwa_key"
                      keyPassword "kainuwa123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source "../.."
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
          }
          gradle_EOF

      - name: Configure Manifest
        run: |
          cat << 'manifest_EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:label="Kainuwa Trading"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>
          manifest_EOF

      - name: Generate App Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compile Signed Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
